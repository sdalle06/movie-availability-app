<header class="app-header">
  <mat-toolbar>
    <div class="toolbar-content">
      <a class="logo-container" routerLink="/" aria-label="Home">
        <div class="logo-wrapper">
          <mat-icon class="logo-icon">play_circle_filled</mat-icon>
        </div>
        <div class="title-container">
          <h1 class="title">{{ title }}</h1>
          <span class="subtitle">Where to stream</span>
        </div>
      </a>

      <div class="nav-links">
        <a routerLink="/movies" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <mat-icon>search</mat-icon>
          <span>Search</span>
        </a>
        <a routerLink="/inspiration" routerLinkActive="active" class="nav-link">
          <mat-icon>auto_awesome</mat-icon>
          <span>Inspiration</span>
        </a>
        <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer" class="nav-link">
          <mat-icon>movie</mat-icon>
          <span>TMDB</span>
        </a>
        <a href="https://www.justwatch.com/" target="_blank" rel="noopener noreferrer" class="nav-link">
          <mat-icon>live_tv</mat-icon>
          <span>JustWatch</span>
        </a>
      </div>
    </div>
  </mat-toolbar>
</header>

<nav class="mobile-nav">
  <a routerLink="/movies" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="mobile-nav-item">
    <mat-icon>search</mat-icon>
    <span>Search</span>
  </a>
  <a routerLink="/inspiration" routerLinkActive="active" class="mobile-nav-item">
    <mat-icon>auto_awesome</mat-icon>
    <span>Inspiration</span>
  </a>
  <a routerLink="/browse" routerLinkActive="active" class="mobile-nav-item">
    <mat-icon>explore</mat-icon>
    <span>Browse</span>
  </a>
</nav>
