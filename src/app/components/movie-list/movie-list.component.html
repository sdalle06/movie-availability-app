<div class="page-container fade-in">
  <div class="main-content">
    <div class="search-section">
      <div class="search-container">
        <app-search (search)="onSearch($event)" [initialQuery]="lastSearchQuery" [initialContentType]="lastContentType"></app-search>
      </div>
    </div>

    <div class="platforms-section">
      <app-platform-selector
        (platformsChange)="onPlatformsChange($event)"
        [selectedPlatforms]="selectedPlatforms">
      </app-platform-selector>
    </div>

    <div *ngIf="!loading && !searchPerformed && recentSearches().length > 0" class="recent-searches slide-up">
      <div class="recent-header">
        <h3 class="recent-title"><mat-icon>history</mat-icon> Recent searches</h3>
        <button mat-button color="warn" (click)="clearHistory()">Clear</button>
      </div>
      <div class="recent-chips">
        <button
          *ngFor="let entry of recentSearches()"
          type="button"
          class="recent-chip"
          (click)="rerunSearch(entry)">
          <mat-icon>search</mat-icon>
          <span class="recent-query">{{ entry.query }}</span>
          <span class="recent-type" *ngIf="entry.contentType !== 'multi'">{{ entry.contentType === 'tv' ? 'TV' : 'Movies' }}</span>
        </button>
      </div>
    </div>

    <div id="loading-section" *ngIf="loading" class="loading-container slide-up">
      <mat-spinner diameter="60" color="accent"></mat-spinner>
      <p class="loading-text">Searching...</p>
    </div>

    <div id="movies-section" *ngIf="!loading && movies.length > 0" class="results-section slide-up">
      <div class="results-header">
        <div class="results-info">
          <h2 class="section-title">Search Results</h2>
          <p class="results-count">Found <span class="count-highlight">{{ movies.length }}</span> results</p>
        </div>
      </div>

      <div class="movies-grid">
        <app-movie-card
          *ngFor="let movie of movies"
          [movie]="movie"
          [selectedPlatforms]="selectedPlatforms">
        </app-movie-card>
      </div>
    </div>

    <div *ngIf="!loading && searchPerformed && movies.length === 0" class="empty-state slide-up">
      <div class="empty-state-content">
        <mat-icon class="empty-icon">search_off</mat-icon>
        <h3 class="empty-title">No Results Found</h3>
        <p class="empty-text">We couldn't find any content matching your search criteria</p>
        <button mat-raised-button color="accent" (click)="resetSearch()">
          <mat-icon>refresh</mat-icon>
          Try Another Search
        </button>
      </div>
    </div>

    <div *ngIf="!loading && !searchPerformed && movies.length === 0" class="empty-state slide-up">
      <div class="empty-state-content">
        <mat-icon class="empty-icon">movie_filter</mat-icon>
        <h3 class="empty-title">Ready to Discover Movies</h3>
        <p class="empty-text">Search for a movie title above to see results</p>
      </div>
    </div>
  </div>
</div>
