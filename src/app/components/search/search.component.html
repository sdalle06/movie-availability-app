<div class="search-container">
  <div class="content-type-selector">
    <mat-button-toggle-group [formControl]="contentTypeControl" class="content-toggle" aria-label="Content type filter">
      <mat-button-toggle value="multi">
        <mat-icon>search</mat-icon>
        <span>All</span>
      </mat-button-toggle>
      <mat-button-toggle value="movie">
        <mat-icon>movie</mat-icon>
        <span>Movies</span>
      </mat-button-toggle>
      <mat-button-toggle value="tv">
        <mat-icon>tv</mat-icon>
        <span>TV Shows</span>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  
  <form class="search-wrapper" (submit)="onSubmit($event)">
    <div class="search-field-wrapper">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Find content</mat-label>
        <input
          matInput
          [formControl]="searchControl"
          placeholder="Enter title to search"
          enterkeyhint="search"
          (focus)="onFocus()"
          (blur)="onBlur()"
          autocomplete="off"
        >
        <mat-icon matPrefix class="search-icon">search</mat-icon>
        <button
          *ngIf="searchControl.value"
          type="button"
          matSuffix
          mat-icon-button
          aria-label="Clear"
          (click)="clearSearch($event)"
        >
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>

      <ul
        *ngIf="showSuggestions && suggestions().length > 0"
        class="suggestions-panel">
        <li
          *ngFor="let entry of suggestions()"
          class="suggestion-item"
          (mousedown)="selectSuggestion(entry)">
          <mat-icon>history</mat-icon>
          <span class="suggestion-query">{{ entry.query }}</span>
          <span class="suggestion-type" *ngIf="entry.contentType !== 'multi'">{{ entry.contentType === 'tv' ? 'TV' : 'Movies' }}</span>
        </li>
      </ul>
    </div>

    <button
      type="submit"
      mat-raised-button
      color="accent"
      class="search-button"
      [disabled]="!searchControl.value"
    >
      <mat-icon>search</mat-icon>
      <span>Search</span>
    </button>
  </form>
</div>
